            {
              "expr": "100 * sum(container_memory_working_set_bytes{namespace=\"donation-service\",container!=\"\"}) / sum(kube_pod_container_resource_requests{namespace=\"donation-service\",resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "memoria"
