          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * ((sum(rate(http_server_duration_milliseconds_count{service_name=\"donation-service\",http_status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_duration_milliseconds_count{service_name=\"donation-service\"}[5m])))",
              "refId": "A",
              "legendFormat": "erros 5xx"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Saturacao dos pods (% dos requests)",
          "id": 9,
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=\"donation-service\",container!=\"\"}[5m])) / sum(kube_pod_container_resource_requests{namespace=\"donation-service\",resource=\"cpu\"})",
              "refId": "A",
              "legendFormat": "cpu"
